<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tech Radar{% endblock %}</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e5e3df;
    --text: #1c1b1a;
    --text-muted: #6b6864;
    --accent: #b5471b;
    --accent-soft: #fdf1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --surface: #201f1c;
      --border: #35332e;
      --text: #f0ede8;
      --text-muted: #a39d94;
      --accent: #ef7f4f;
      --accent-soft: #2c211a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
  }
  header .brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  header .brand a { color: var(--text); }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
  .muted { color: var(--text-muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
  }
  .card p, main p { margin: 0.5rem 0 0; }
  .card p:first-child, main p:first-child { margin-top: 0; }
  .card ul, .card ol { margin: 0.4rem 0 0; padding-left: 1.3rem; }
  .card li { margin: 0.15rem 0; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge.fail { background: #f3d9d9; color: #a0342f; }
  table { width: 100%; border-collapse: collapse; }
  .spin {
    display: inline-block; width: 0.85em; height: 0.85em; vertical-align: -0.1em;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; opacity: 0.6; } }
  .waiting { margin: 0.6rem 0 0; font-size: 0.85rem; }
  a.cite { font-size: 0.85em; font-weight: 600; text-decoration: none;
           padding: 0 0.1em; white-space: nowrap; }
  a.cite:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="/digests">Tech Radar</a></div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// 질의는 30초쯤 걸린다. 폼을 그냥 제출하면 브라우저가 즉시 이동을 시작해서
// 화면 갱신이 그려지기 전에 멈춘다 — 주소창 탭만 돌고 페이지는 그대로다.
// 그래서 이동을 막고, 대기 화면을 그린 뒤, 다음 프레임에 직접 이동시킨다.
document.addEventListener("submit", function (e) {
  var form = e.target.closest('form[data-slow]');
  if (!form) return;
  var input = form.querySelector('input[name=q]');
  var q = input ? input.value.trim() : "";
  if (!q) return;
  e.preventDefault();

  var main = document.querySelector('main');
  if (main) {
    main.innerHTML =
      '<h1>아카이브에 물어보기</h1>' +
      '<div class="card">' +
        '<p><strong>' + q.replace(/[<>&]/g, function (c) {
          return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
        }) + '</strong></p>' +
        '<p class="muted"><span class="spin"></span> ' +
        '<span id="ask-elapsed">아카이브 전체를 읽는 중입니다</span></p>' +
        '<p class="muted" style="font-size:0.85rem;">' +
        '제목 4,600여 건을 열 묶음으로 나눠 훑은 뒤, 고른 글의 본문을 읽습니다. ' +
        '보통 30초쯤 걸립니다.</p>' +
      '</div>';
    var el = document.getElementById('ask-elapsed');
    var t0 = Date.now();
    setInterval(function () {
      var sec = Math.round((Date.now() - t0) / 1000);
      el.textContent = '아카이브 전체를 읽는 중입니다 (' + sec + '초)';
    }, 1000);
  }
  // 두 프레임을 기다려 위 화면이 실제로 그려진 뒤에 이동한다
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      window.location.href = '/ask?q=' + encodeURIComponent(q);
    });
  });
});
</script>
</body>
</html>
