<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tech Radar{% endblock %}</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e5e3df;
    --text: #1c1b1a;
    --text-muted: #6b6864;
    --accent: #b5471b;
    --accent-soft: #fdf1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --surface: #201f1c;
      --border: #35332e;
      --text: #f0ede8;
      --text-muted: #a39d94;
      --accent: #ef7f4f;
      --accent-soft: #2c211a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
  }
  header .brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  header .brand a { color: var(--text); }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
  .muted { color: var(--text-muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
  }
  .card p, main p { margin: 0.5rem 0 0; }
  .card p:first-child, main p:first-child { margin-top: 0; }
  .card ul, .card ol { margin: 0.4rem 0 0; padding-left: 1.3rem; }
  .card li { margin: 0.15rem 0; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge.fail { background: #f3d9d9; color: #a0342f; }
  table { width: 100%; border-collapse: collapse; }
  .spin {
    display: inline-block; width: 0.85em; height: 0.85em; vertical-align: -0.1em;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; opacity: 0.6; } }
  .waiting { margin: 0.6rem 0 0; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="/digests">Tech Radar</a></div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
document.addEventListener("submit", function (e) {
  var form = e.target.closest('form[data-slow]');
  if (!form) return;
  var btn = form.querySelector('button[type=submit]');
  var note = form.querySelector('.waiting');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  if (!note) return;
  var t0 = Date.now();
  note.hidden = false;
  note.textContent = '아카이브 전체를 읽는 중입니다 — 보통 30초쯤 걸립니다.';
  setInterval(function () {
    var sec = Math.round((Date.now() - t0) / 1000);
    note.textContent = '아카이브 전체를 읽는 중입니다 (' + sec + '초) — 보통 30초쯤 걸립니다.';
  }, 1000);
});
</script>
</body>
</html>
