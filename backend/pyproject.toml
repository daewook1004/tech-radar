[project]
name = "tech-radar-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2.9",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "feedparser",
    "requests",
    "openai",
    "fastembed",
    "numpy",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
