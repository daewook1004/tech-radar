geeknews:
  rss_url: "https://feeds.feedburner.com/geeknews-feed"   # 검증 완료 (2026-08-26)

hackernews:
  min_points: 50

github:
  watch_repos:
    - pytorch/pytorch
    - huggingface/transformers
    - langchain-ai/langchain
    - run-llama/llama_index
    - vllm-project/vllm
    - ollama/ollama
    - openai/openai-python
    - anthropics/anthropic-sdk-python
  trending_approx:
    keywords: ["LLM", "agent", "RAG", "inference", "fine-tuning"]
    created_within_days: 14
    min_stars: 50

arxiv:
  categories: ["cs.CL", "cs.LG", "cs.AI", "cs.MA"]
  keywords: ["retrieval augmented generation", "agent", "fine-tuning", "evaluation"]

# Anthropic/Meta AI는 공식 RSS가 없어 목록에서 제외(2026-08-26). Anthropic 소식은
# github.com/anthropics/anthropic-sdk-python(Watch) + GeekNews/HN에서 어느 정도 커버됨.
rss_blogs:
  - name: "OpenAI"
    url: "https://openai.com/blog/rss.xml"                 # 최근 7일 lookback 필터 적용됨(전체 아카이브 반환 이슈)
  - name: "Google AI"
    url: "https://blog.google/technology/ai/rss/"
  - name: "Hugging Face"
    url: "https://huggingface.co/blog/feed.xml"             # 최근 7일 lookback 필터 적용됨(전체 아카이브 반환 이슈)
  - name: "PyTorch Korea"
    url: "https://pytorch.kr/feed.xml"                     # 검증 완료 (2026-08-26)
  - name: "TechBlogPosts (국내 기업 기술 블로그 애그리게이터)"
    url: "https://www.techblogposts.com/rss.xml"            # 검증 완료 (2026-08-26)
  - name: "HCI Today"
    url: "https://www.hci.today/api/feed"                   # 검증 완료 (2026-09-07, 하루 4~5건).
                                                            # 사이트가 <link rel=alternate>로 광고하는 경로가 /api/feed다
                                                            # (/rss, /feed 등은 SPA 셸 HTML을 200으로 돌려주니 주의).
