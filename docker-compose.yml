services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: techradar
      POSTGRES_PASSWORD: techradar
      POSTGRES_DB: techradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://techradar:techradar@postgres:5432/techradar
      CONFIG_DIR: /app/config
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"

# frontend + proxy(Caddy)는 Phase 3(대시보드 구현)에서 추가 예정 — docs/ARCHITECTURE.md §9 참조

volumes:
  pgdata:
