services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: techradar
      POSTGRES_PASSWORD: techradar
      POSTGRES_DB: techradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://techradar:techradar@postgres:5432/techradar
      CONFIG_DIR: /app/config
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"

  # 대시보드(Next.js)는 아직 없음 — 지금은 도메인 TLS + /health 프록시만.
  # DOMAIN이 .env에 없으면(로컬 개발) 이 서비스는 그냥 안 쓰면 됨:
  # `docker compose up -d postgres backend`처럼 필요한 서비스만 지정해서 띄우기.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
